# Builds the Gutschein-Safe Android app (folder gutschein-app/) and uploads the installable APK.
name: Gutschein-Safe APK

on:
  push:
    paths:
      - 'gutschein-app/**'
      - '.github/workflows/gutschein-app.yml'
  workflow_dispatch:

concurrency:
  group: gutschein-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gutschein-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without a signing secret the debug key is used. Keeping it cached means later
      # builds still install as updates over earlier ones.
      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gutschein-debug-keystore

      - name: Decode signing key (optional secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.GUTSCHEIN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.GUTSCHEIN_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.GUTSCHEIN_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.GUTSCHEIN_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Gutschein-Safe-build-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Gutschein-Safe-APK
          path: gutschein-app/out/*.apk
          if-no-files-found: error
